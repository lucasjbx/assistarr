name: Assistarr
version: "1.0.0"
slug: assistarr
description: MCP server (Streamable HTTP) que conecta Radarr/Sonarr con HA Assist, Claude y Gemini
url: https://github.com/lucasjbx/assistarr
arch:
  - amd64
  - aarch64
init: false
host_network: true
